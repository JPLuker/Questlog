version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    groups: { gradle: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /tests/web
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
