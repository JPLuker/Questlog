<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quest Log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="win hud">
    <div id="hudHero" class="doll hud-doll" aria-hidden="true"></div>
    <div class="hud-main">
      <div class="hud-top"><span id="hudLevel" class="px">LV 1</span><span id="hudXp" class="px dim">0/10</span></div>
      <div class="bar"><div id="hudBar" class="bar-fill"></div></div>
    </div>
    <button id="settingsBtn" class="icon-btn px" type="button" aria-label="Settings">☰</button>
  </header>

  <main id="views">
    <section id="view-quests" class="view">
      <form id="addForm" class="win add" autocomplete="off">
        <input id="newQuest" type="text" maxlength="300" placeholder="New quest" enterkeyhint="done">
        <button class="btn px" type="submit" aria-label="Add quest">+</button>
      </form>
      <ul id="questList" class="list"></ul>
    </section>

    <section id="view-hero" class="view" hidden>
      <div class="win hero-card">
        <div id="heroBig" class="doll big" role="img" aria-label="Your hero"></div>
        <div id="heroName" class="px title"></div>
        <div id="heroLevel" class="px">LV 1</div>
        <div class="bar wide"><div id="heroBar" class="bar-fill"></div></div>
        <div id="heroNext" class="px dim small"></div>
        <button id="editHeroBtn" class="btn px small" type="button">EDIT HERO</button>
      </div>
      <div class="win stats">
        <div><span class="px dim small">TOTAL XP</span><b id="stTotal" class="px">0</b></div>
        <div><span class="px dim small">QUESTS</span><b id="stDone" class="px">0</b></div>
        <div><span class="px dim small">TODAY</span><b id="stToday" class="px">0</b></div>
        <div><span class="px dim small">BEST DAY</span><b id="stBest" class="px">0</b></div>
      </div>
      <div class="win">
        <div class="px dim small label">GEAR</div>
        <div id="gearGrid" class="gear"></div>
      </div>
    </section>

    <section id="view-log" class="view" hidden>
      <div id="logList"></div>
    </section>
  </main>

  <nav class="win tabs">
    <button class="tab active" data-view="quests" type="button"><img src="img/scroll.png" alt=""><span class="px">QUESTS</span></button>
    <button class="tab" data-view="hero" type="button"><div id="tabHero" class="doll tab-doll" aria-hidden="true"></div><span class="px">HERO</span></button>
    <button class="tab" data-view="log" type="button"><img src="img/book.png" alt=""><span class="px">LOG</span></button>
  </nav>
</div>

<div id="sheet" class="overlay" hidden>
  <div class="win sheet-box" id="sheetBox" role="dialog" aria-modal="true"></div>
</div>

<div id="levelUp" class="overlay center" hidden>
  <div class="win levelup-box" role="alertdialog" aria-live="assertive">
    <div class="px title gold">LEVEL UP!</div>
    <div id="luHero" class="doll big" aria-hidden="true"></div>
    <div id="luLevel" class="px title">LV 2</div>
    <div id="luGear" class="px small gold" hidden>NEW GEAR</div>
    <button id="luOk" class="btn px" type="button">OK</button>
  </div>
</div>

<div id="creator" class="overlay center" hidden>
  <div class="win creator-box" role="dialog" aria-modal="true" aria-labelledby="crTitle">
    <div id="crTitle" class="px title gold">NEW HERO</div>
    <div id="crDoll" class="doll big" role="img" aria-label="Hero preview"></div>
    <div class="cr-row"><button class="btn px arrow" type="button" data-part="body" data-step="-1" aria-label="Previous body">&lt;</button><div class="cr-label"><span class="px small dim">BODY</span><span id="crBody" class="px"></span></div><button class="btn px arrow" type="button" data-part="body" data-step="1" aria-label="Next body">&gt;</button></div>
    <div class="cr-row"><button class="btn px arrow" type="button" data-part="skin" data-step="-1" aria-label="Previous skin tone">&lt;</button><div class="cr-label"><span class="px small dim">SKIN</span><span id="crSkin" class="px"></span></div><button class="btn px arrow" type="button" data-part="skin" data-step="1" aria-label="Next skin tone">&gt;</button></div>
    <div class="cr-row"><button class="btn px arrow" type="button" data-part="hair" data-step="-1" aria-label="Previous hair">&lt;</button><div class="cr-label"><span class="px small dim">HAIR</span><span id="crHair" class="px"></span></div><button class="btn px arrow" type="button" data-part="hair" data-step="1" aria-label="Next hair">&gt;</button></div>
    <label class="cr-name"><span class="px small dim">NAME</span><input id="crName" type="text" maxlength="14" placeholder="HERO" autocomplete="off"></label>
    <div class="sheet-row"><button id="crCancel" class="btn px small" type="button">CANCEL</button><button id="crDone" class="btn px small" type="button">START</button></div>
  </div>
</div>

<div id="coach" class="win coach" role="status" aria-live="polite" hidden>
  <div id="coachText" class="px small"></div>
  <div class="coach-row"><button id="coachSkip" class="btn px small" type="button">SKIP</button><button id="coachOk" class="btn px small" type="button" hidden>OK</button></div>
</div>

<script src="app.js"></script>
</body>
</html>
