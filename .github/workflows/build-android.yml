name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Versions
        run: node --version && google-chrome --version
      - name: Web UI tests
        working-directory: tests/web
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SHOTS_DIR: ${{ runner.temp }}/screenshots
        run: npm ci && npm test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # A test APK anyone can try before the signing key exists. Not a release build:
  # separate package id (com.jpluker.questlog.test), throwaway key, artifact only.
  test-build:
    needs: web-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"
      - name: Versions
        run: java -version && gradle --version
      - name: Build test APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check and package
        id: pkg
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$apk" ]] || { echo "::error::No test APK at $apk"; exit 1; }
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          badging="$("$bt/aapt2" dump badging "$apk")"
          head -n 1 <<< "$badging"
          grep -q "^package: name='com.jpluker.questlog.test' versionCode='$GITHUB_RUN_NUMBER' versionName='$version-test'" <<< "$badging" \
            || { echo "::error::Test APK has the wrong package id or version"; exit 1; }
          name="QuestLog-$version-Android-universal-TEST-build$GITHUB_RUN_NUMBER-UNTESTED.apk"
          mkdir -p dist && cp "$apk" "dist/$name"
          {
            echo "Quest Log TEST build $GITHUB_RUN_NUMBER (version $version, commit $GITHUB_SHA)"
            echo "UNTESTED test build, signed with a throwaway key. Not a release."
            echo "Installs as \"Quest Log TEST\" beside the real app. To install a newer test build,"
            echo "export a backup from the menu, uninstall the old test app, then install and import."
          } > dist/TEST_BUILD_README.txt
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: web-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.QUESTLOG_ANDROID_KEYSTORE_B64 }}
      QUESTLOG_ANDROID_STORE_PASSWORD: ${{ secrets.QUESTLOG_ANDROID_STORE_PASSWORD }}
      QUESTLOG_ANDROID_KEY_PASSWORD: ${{ secrets.QUESTLOG_ANDROID_KEY_PASSWORD }}
      QUESTLOG_ANDROID_KEY_ALIAS: ${{ secrets.QUESTLOG_ANDROID_KEY_ALIAS }}
      CERT_SHA256: ${{ secrets.QUESTLOG_ANDROID_CERT_SHA256 }}
      PACKAGE_ID: com.jpluker.questlog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check signing secrets
        id: secrets
        run: |
          missing=()
          for name in KEYSTORE_B64 QUESTLOG_ANDROID_STORE_PASSWORD QUESTLOG_ANDROID_KEY_PASSWORD QUESTLOG_ANDROID_KEY_ALIAS CERT_SHA256; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            # Tags and manual runs must produce a signed build; plain pushes skip until the key exists.
            if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Signing secrets missing (${missing[*]}). Run android/scripts/setup-signing.sh on a trusted computer."
              exit 1
            fi
            echo "::notice::No signing key yet, so no signed APK. Run android/scripts/setup-signing.sh on a trusted computer. The test build job still ran."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::QUESTLOG_ANDROID_CERT_SHA256 isn't a SHA-256 fingerprint. Run android/scripts/setup-signing.sh again."; exit 1; }

      - name: Work out the version
        if: steps.secrets.outputs.ready == 'true'
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION file holds '$version', not x.y.z"; exit 1; }
          untested=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            base="${tag%-untested-android}"
            [[ "$base" != "$tag" ]] && untested=true
            [[ "$base" == "v$version" ]] || { echo "::error::Tag $tag doesn't match VERSION $version"; exit 1; }
          fi
          # Android hasn't been run by a person yet, so every build is labelled UNTESTED (RELEASES.md 2).
          # Once a build is confirmed on a phone, plain vX.Y.Z tags can carry the tested build.
          suffix=""; [[ "$untested" == true || "$GITHUB_REF_TYPE" != "tag" ]] && suffix="-UNTESTED"
          {
            echo "version=$version"
            echo "untested=$untested"
            echo "apk=QuestLog-$version-Android-universal$suffix.apk"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          gradle-version: "8.9"

      - name: Versions
        if: steps.secrets.outputs.ready == 'true'
        run: java -version && gradle --version

      - name: Build signed APK
        if: steps.secrets.outputs.ready == 'true'
        run: |
          keystore="$RUNNER_TEMP/questlog-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          QUESTLOG_KEYSTORE_FILE="$keystore" gradle :app:assembleRelease --no-daemon --stacktrace
          rm -f "$keystore"

      - name: Check the APK (signer, package, version, not debuggable)
        if: steps.secrets.outputs.ready == 'true'
        id: check
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          [[ -s "$apk" ]] || { echo "::error::No signed APK at $apk"; exit 1; }
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "build-tools: $bt"

          certs="$("$bt/apksigner" verify --verbose --print-certs "$apk")"
          signers="$(grep -cE '^Signer #[0-9]+ certificate SHA-256 digest: [0-9a-f]{64}$' <<< "$certs" || true)"
          [[ "$signers" == "1" ]] || { echo "::error::Expected exactly one signer, found $signers"; exit 1; }
          got="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' <<< "$certs")"
          [[ "$got" == "$CERT_SHA256" ]] || { echo "::error::APK signer $got doesn't match the pinned fingerprint"; exit 1; }

          badging="$("$bt/aapt2" dump badging "$apk")"
          grep -qE "^package: name='$PACKAGE_ID' versionCode='$GITHUB_RUN_NUMBER' versionName='${{ steps.version.outputs.version }}'" <<< "$badging" \
            || { echo "::error::Package id or version is wrong:"; head -n 1 <<< "$badging"; exit 1; }
          if grep -q "application-debuggable" <<< "$badging"; then echo "::error::APK is debuggable"; exit 1; fi

          mkdir -p dist
          cp "$apk" "dist/${{ steps.version.outputs.apk }}"
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: ${{ steps.version.outputs.apk }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: steps.secrets.outputs.ready == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          UNTESTED: ${{ steps.version.outputs.untested }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          tag="$GITHUB_REF_NAME"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          notes="$RUNNER_TEMP/notes.md"
          if [[ "$UNTESTED" == true ]]; then
            title="UNTESTED — Android build for v$VERSION"
            {
              echo "> ⚠️ **UNTESTED BUILD.** These Android builds were produced automatically and have not been run by a person. They may not install, launch, or work correctly. For tested builds, use [v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION)."
              echo
            } > "$notes"
            flags=(--prerelease --latest=false)
          else
            title="Quest Log v$VERSION"
            : > "$notes"
            flags=(--latest)
          fi
          awk -v v="## $VERSION" '$0 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md >> "$notes"
          {
            echo
            echo "## Downloads"
            echo "**Android:** [APK]($url/$APK)"
          } >> "$notes"
          gh release create "$tag" dist/* --title "$title" --notes-file "$notes" --verify-tag "${flags[@]}"

          # Check what was published (RELEASES.md 6.2).
          gh release view "$tag" --json assets,isPrerelease --jq '.' > "$RUNNER_TEMP/release.json"
          for f in dist/*; do
            name="$(basename "$f")"
            size="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' "$RUNNER_TEMP/release.json")"
            [[ -n "$size" && "$size" -gt 0 ]] || { echo "::error::$name is missing or empty on the release"; exit 1; }
          done
          [[ "$(jq -r .isPrerelease "$RUNNER_TEMP/release.json")" == "$UNTESTED" ]] || { echo "::error::Pre-release flag is wrong"; exit 1; }
          echo "Release $tag checked."
